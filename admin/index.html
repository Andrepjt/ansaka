<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Admin | Rumah Ansaka</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { DEFAULT: '#FE2C55', cyan: '#25F4EE' } }
                }
            }
        }
    </script>
</head>

<body class="bg-neutral-100 text-neutral-800 font-sans min-h-screen">
    <!-- Login -->
    <section id="loginView" class="min-h-screen flex items-center justify-center px-4">
        <form id="loginForm" class="w-full max-w-[360px] bg-white rounded-3xl border border-neutral-200 p-6 shadow-sm">
            <div
                class="w-16 h-16 mx-auto rounded-full bg-brand border-4 border-white text-white flex items-center justify-center text-lg font-extrabold shadow-[-3px_-3px_0_#25F4EE,3px_3px_0_#FE2C55]">
                RA</div>
            <h1 class="mt-4 text-center text-lg font-extrabold">Masuk Admin</h1>
            <p class="mt-1 text-center text-xs text-neutral-500">Kelola link affiliate Rumah Ansaka</p>

            <label class="block mt-6 text-xs font-semibold">Username
                <input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"
                    class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
            </label>
            <label class="block mt-3 text-xs font-semibold">Password
                <input name="password" type="password" required autocomplete="current-password"
                    class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
            </label>

            <p id="loginError" class="hidden mt-3 px-3 py-2 rounded-xl bg-red-100 text-red-800 text-xs font-semibold"></p>
            <button id="loginBtn" class="mt-5 w-full py-3 rounded-xl bg-brand text-white text-sm font-bold disabled:opacity-50">Masuk</button>
            <a href="/" class="block mt-4 text-center text-xs font-semibold text-neutral-500 hover:text-brand">← Kembali ke situs</a>
        </form>
    </section>

    <div id="adminView" class="hidden w-full max-w-[480px] mx-auto px-4 py-5">

        <header class="flex items-center justify-between mb-4">
            <h1 class="text-base font-extrabold">Admin Rumah Ansaka</h1>
            <div class="flex gap-3 text-xs font-semibold">
                <a href="/" target="_blank" class="text-neutral-500 hover:text-brand">Lihat situs ↗</a>
                <button onclick="logout()" class="text-neutral-500 hover:text-brand">Keluar</button>
            </div>
        </header>

        <p id="status" class="hidden my-3 px-3 py-2 rounded-xl text-xs font-semibold"></p>

        <main id="adminPanel">
            <!-- Add / edit form -->
            <form id="itemForm" class="bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm space-y-3">
                <h2 id="formTitle" class="text-sm font-bold">Tambah link</h2>
                <div class="grid grid-cols-3 gap-2">
                    <label class="block text-xs font-semibold">Nomor
                        <input name="number" inputmode="numeric" pattern="[0-9]+" required
                            class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
                    </label>
                    <label class="col-span-2 block text-xs font-semibold">Platform
                        <select name="platform"
                            class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base bg-white focus:outline-none focus:ring-2 focus:ring-brand">
                            <option value="shopee">Shopee</option>
                            <option value="tiktok">TikTok</option>
                            <option value="tokopedia">Tokopedia</option>
                            <option value="lazada">Lazada</option>
                            <option value="umum">Lainnya</option>
                        </select>
                    </label>
                </div>
                <label class="block text-xs font-semibold">Nama barang
                    <input name="title" required
                        class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
                </label>
                <label class="block text-xs font-semibold">Kategori
                    <input name="category" list="categoryList" required placeholder="Pilih atau ketik kategori baru"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
                </label>
                <datalist id="categoryList"></datalist>
                <label class="block text-xs font-semibold">Badge <span class="font-normal text-neutral-400">(boleh kosong)</span>
                    <input name="badge" placeholder="cth: Viral FYP"
                        class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
                </label>
                <label class="block text-xs font-semibold">Link affiliate
                    <input name="url" type="url" required placeholder="https://..."
                        class="mt-1 w-full px-3 py-2.5 rounded-xl border border-neutral-300 text-base focus:outline-none focus:ring-2 focus:ring-brand">
                </label>
                <div class="flex gap-2">
                    <button id="saveBtn" class="flex-1 py-2.5 rounded-xl bg-brand text-white text-sm font-bold disabled:opacity-50">Simpan</button>
                    <button type="button" id="cancelBtn" onclick="resetForm()"
                        class="hidden px-4 py-2.5 rounded-xl bg-neutral-200 text-sm font-bold">Batal</button>
                </div>
            </form>

            <!-- Link list -->
            <p id="countText" class="mt-5 mb-2 px-1 text-[11px] font-medium text-neutral-500"></p>
            <ul id="linkList" class="space-y-2"></ul>

            <!-- Raw JSON -->
            <details class="mt-5 bg-white rounded-2xl border border-neutral-200 p-4 shadow-sm">
                <summary class="text-sm font-bold cursor-pointer">Edit JSON langsung</summary>
                <p class="mt-2 text-xs text-neutral-500">Untuk ubah banyak link sekaligus. Urutan di JSON = urutan di situs.</p>
                <textarea id="jsonInput" spellcheck="false"
                    class="mt-2 w-full h-72 p-3 rounded-xl bg-neutral-900 text-neutral-100 font-mono text-xs"></textarea>
                <button onclick="saveJson()" class="mt-2 w-full py-2.5 rounded-xl bg-neutral-900 text-white text-sm font-bold">Simpan JSON</button>
            </details>
        </main>
    </div>

    <script>
        const FIELDS = ['number', 'title', 'category', 'platform', 'badge', 'url'];
        const $ = id => document.getElementById(id);
        const esc = value => String(value).replace(/[&<>"']/g, ch => `&#${ch.charCodeAt(0)};`);

        let links = [];
        let editingIndex = -1;
        let auth = ''; // "user:pass", each part URI-encoded (see functions/admin/api.js)
        try { auth = localStorage.getItem('adminAuth') || ''; } catch (e) { }

        async function api(method, body) {
            const res = await fetch('/admin/api', {
                method,
                headers: { Authorization: 'Bearer ' + auth, 'Content-Type': 'application/json' },
                body: body && JSON.stringify(body),
            });
            const data = await res.json().catch(() => ({ error: `Server error (${res.status}).` }));
            if (!res.ok) throw Object.assign(new Error(data.error), { status: res.status });
            return data;
        }

        function setStatus(message, type) {
            const colors = { ok: 'bg-emerald-100 text-emerald-800', error: 'bg-red-100 text-red-800' };
            $('status').className = `my-3 px-3 py-2 rounded-xl text-xs font-semibold ${colors[type] || 'bg-neutral-200 text-neutral-700'}`;
            $('status').textContent = message;
        }

        function showLogin(message) {
            $('adminView').classList.add('hidden');
            $('loginView').classList.remove('hidden');
            $('loginError').textContent = message || '';
            $('loginError').classList.toggle('hidden', !message);
        }

        async function start() {
            $('loginBtn').disabled = true;
            $('loginBtn').textContent = 'Memuat...';
            try {
                links = (await api('GET')).links;
            } catch (err) {
                if (err.status === 401) {
                    try { localStorage.removeItem('adminAuth'); } catch (e) { }
                }
                return showLogin(err.message);
            } finally {
                $('loginBtn').disabled = false;
                $('loginBtn').textContent = 'Masuk';
            }
            try { localStorage.setItem('adminAuth', auth); } catch (e) { }
            $('loginView').classList.add('hidden');
            $('adminView').classList.remove('hidden');
            $('status').className = 'hidden';
            render();
            resetForm();
        }

        function logout() {
            auth = '';
            try { localStorage.removeItem('adminAuth'); } catch (e) { }
            $('loginForm').elements.password.value = '';
            showLogin();
        }

        function render() {
            $('countText').textContent = `${links.length} link (paling atas = paling atas di situs)`;
            $('categoryList').innerHTML = [...new Set(links.map(item => item.category))].map(cat => `<option value="${esc(cat)}">`).join('');
            $('jsonInput').value = JSON.stringify(links, null, 4);
            $('linkList').innerHTML = links.map((item, i) => `
                <li class="flex items-center gap-3 bg-white rounded-2xl border border-neutral-200 p-3 shadow-sm">
                    <span class="shrink-0 min-w-[48px] text-center px-2 py-2 rounded-xl bg-neutral-900 text-white text-xs font-extrabold">#${esc(item.number)}</span>
                    <div class="flex-1 min-w-0">
                        <p class="text-xs font-bold leading-snug line-clamp-2">${esc(item.title)}</p>
                        <p class="mt-0.5 text-[11px] text-neutral-500 truncate">${esc(item.category)} · ${esc(item.platform)}${item.badge ? ' · ' + esc(item.badge) : ''}</p>
                    </div>
                    <button data-index="${i}" onclick="editItem(+this.dataset.index)" class="text-xs font-semibold text-neutral-600 hover:text-brand px-1">Edit</button>
                    <button data-index="${i}" onclick="deleteItem(+this.dataset.index)" class="text-xs font-semibold text-red-600 px-1">Hapus</button>
                </li>
            `).join('');
        }

        function nextNumber() {
            const highest = Math.max(0, ...links.map(item => parseInt(item.number, 10) || 0));
            return String(highest + 1).padStart(3, '0');
        }

        function resetForm() {
            editingIndex = -1;
            const form = $('itemForm');
            const platform = form.elements.platform.value;
            form.reset();
            form.elements.platform.value = platform;
            form.elements.number.value = nextNumber();
            $('formTitle').textContent = 'Tambah link';
            $('cancelBtn').classList.add('hidden');
        }

        function editItem(index) {
            editingIndex = index;
            const form = $('itemForm');
            FIELDS.forEach(field => form.elements[field].value = links[index][field]);
            $('formTitle').textContent = `Edit #${links[index].number}`;
            $('cancelBtn').classList.remove('hidden');
            form.scrollIntoView({ behavior: 'smooth' });
        }

        async function save(newLinks) {
            $('saveBtn').disabled = true;
            setStatus('Menyimpan...');
            try {
                links = (await api('PUT', { links: newLinks })).links;
                render();
                setStatus('Tersimpan ✓ Tampil di situs dalam beberapa detik (paling lama ±1 menit).', 'ok');
                return true;
            } catch (err) {
                setStatus(err.message, 'error');
                return false;
            } finally {
                $('saveBtn').disabled = false;
            }
        }

        $('itemForm').onsubmit = async event => {
            event.preventDefault();
            const form = event.target;
            const item = Object.fromEntries(FIELDS.map(field => [field, form.elements[field].value.trim()]));
            item.number = item.number.padStart(3, '0');

            const sameNumber = links.findIndex(other => other.number === item.number);
            if (sameNumber !== -1 && sameNumber !== editingIndex) return setStatus(`Nomor #${item.number} sudah dipakai.`, 'error');

            const isNew = editingIndex === -1;
            const newLinks = [...links];
            if (isNew) newLinks.unshift(item); else newLinks[editingIndex] = item;
            if (await save(newLinks)) resetForm();
        };

        async function deleteItem(index) {
            const item = links[index];
            if (!confirm(`Hapus #${item.number} ${item.title}?`)) return;
            if (await save(links.filter((_, i) => i !== index)) && editingIndex !== -1) resetForm();
        }

        async function saveJson() {
            let parsed;
            try {
                parsed = JSON.parse($('jsonInput').value);
            } catch (err) {
                return setStatus('JSON tidak valid: ' + err.message, 'error');
            }
            if (await save(parsed)) resetForm();
        }

        $('loginForm').onsubmit = event => {
            event.preventDefault();
            const fields = event.target.elements;
            auth = encodeURIComponent(fields.username.value.trim()) + ':' + encodeURIComponent(fields.password.value);
            start();
        };

        if (auth) start();
    </script>
</body>

</html>
